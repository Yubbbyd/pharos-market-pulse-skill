<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Market Pulse — Pharos Skill Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f4ff;
    --muted: #8896b0;
    --accent: #4f8ef7;
    --accent2: #7c5cfc;
    --green: #22d3a0;
    --red: #f26b6b;
    --amber: #f9a825;
    --pros: #6ee7b7;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    min-height: 100vh;
    padding: 0;
  }

  /* Header */
  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
  }
  .logo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; }
  .badge {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(79,142,247,0.12);
    color: var(--accent);
    border: 1px solid rgba(79,142,247,0.25);
    letter-spacing: 0.3px;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  #last-updated { font-size: 12px; color: var(--muted); }

  /* Layout */
  main { padding: 32px; max-width: 1100px; margin: 0 auto; }

  .section-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  /* Price cards */
  .prices-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 36px;
  }

  .price-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .price-card:hover { border-color: var(--border2); }
  .price-card .token-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .token-icon {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
  }
  .price-card .price-value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }
  .price-card .change {
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .change.up { color: var(--green); }
  .change.down { color: var(--red); }
  .change-arrow { font-size: 16px; line-height: 1; }

  .card-accent {
    position: absolute;
    top: 0; right: 0;
    width: 80px; height: 80px;
    border-radius: 0 14px 0 80px;
    opacity: 0.06;
  }

  /* PROS card special */
  .price-card.pros-card { border-color: rgba(110,231,183,0.2); }
  .price-card.pros-card .card-accent { background: var(--pros); opacity: 0.1; }

  /* News */
  .news-list { display: flex; flex-direction: column; gap: 12px; }

  .news-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.2s, background 0.2s;
    cursor: pointer;
  }
  .news-item:hover { border-color: var(--border2); background: var(--surface2); }

  .news-index {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    min-width: 22px;
    padding-top: 2px;
  }
  .news-content { flex: 1; }
  .news-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 6px;
    color: var(--text);
  }
  .news-meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .news-meta .dot { opacity: 0.4; }
  .news-summary {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
    margin-top: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .news-arrow { color: var(--muted); font-size: 16px; padding-top: 2px; opacity: 0.5; }

  /* Refresh button */
  .refresh-btn {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    background: transparent;
    color: var(--accent);
    border: 1px solid rgba(79,142,247,0.3);
    border-radius: 8px;
    padding: 7px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s, border-color 0.15s;
  }
  .refresh-btn:hover { background: rgba(79,142,247,0.08); border-color: rgba(79,142,247,0.5); }
  .refresh-btn svg { width: 14px; height: 14px; }

  /* Skeleton loader */
  .skeleton {
    background: linear-gradient(90deg, var(--surface2) 25%, var(--surface) 50%, var(--surface2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 6px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    padding: 10px 16px;
    border-radius: 8px;
    margin-bottom: 28px;
  }
  .status-bar.ok { background: rgba(34,211,160,0.07); color: var(--green); border: 1px solid rgba(34,211,160,0.15); }
  .status-bar.partial { background: rgba(249,168,37,0.07); color: var(--amber); border: 1px solid rgba(249,168,37,0.15); }
  .status-bar.error { background: rgba(242,107,107,0.07); color: var(--red); border: 1px solid rgba(242,107,107,0.15); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  /* Powered by */
  .footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .footer a { color: var(--accent); text-decoration: none; }

  @media (max-width: 600px) {
    main { padding: 20px 16px; }
    .prices-grid { grid-template-columns: 1fr; }
    header { padding: 14px 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-dot"></span>
    Market Pulse Skill
  </div>
  <div class="header-right">
    <span id="last-updated">Loading...</span>
    <button class="refresh-btn" onclick="loadData()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      Refresh
    </button>
  </div>
</header>

<main>
  <div id="status-bar" class="status-bar ok" style="display:none;">
    <div class="status-dot"></div>
    <span id="status-text">All systems operational</span>
  </div>

  <div class="section-label">Live Token Prices</div>
  <div class="prices-grid" id="prices-grid">
    <div class="price-card"><div class="skeleton" style="height:80px;"></div></div>
    <div class="price-card"><div class="skeleton" style="height:80px;"></div></div>
    <div class="price-card"><div class="skeleton" style="height:80px;"></div></div>
  </div>

  <div class="section-label">Trending Crypto News</div>
  <div class="news-list" id="news-list">
    <div class="news-item"><div class="skeleton" style="height:60px; flex:1;"></div></div>
    <div class="news-item"><div class="skeleton" style="height:60px; flex:1;"></div></div>
    <div class="news-item"><div class="skeleton" style="height:60px; flex:1;"></div></div>
  </div>

  <div class="footer">
    <span>Pharos AI Agent Carnival — Phase 1 Skill Demo</span>
    <span>Powered by <a href="https://www.coingecko.com" target="_blank">CoinGecko</a> & <a href="https://gnews.io" target="_blank">GNews</a></span>
  </div>
</main>

<script>
const TOKEN_META = {
  bitcoin:  { symbol: 'BTC', color: '#f7931a', initials: '₿' },
  ethereum: { symbol: 'ETH', color: '#627eea', initials: 'Ξ' },
  "pharos-network":   { symbol: 'PROS', color: '#6ee7b7', initials: 'P' },
};

async function fetchPrices() {
  const ids = Object.keys(TOKEN_META).join(',');
  const url = `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Price fetch failed');
  return res.json();
}

async function fetchNews() {
  const res = await fetch(`https://gnews.io/api/v4/search?q=crypto+DeFi+blockchain&lang=en&max=5&apikey=demo`);
  if (!res.ok) throw new Error('News fetch failed');
  return res.json();
}

function formatPrice(n) {
  if (n >= 1000) return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 });
  if (n >= 1) return '$' + n.toFixed(2);
  return '$' + n.toFixed(4);
}

function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime();
  const hrs = Math.floor(diff / 3600000);
  if (hrs < 1) return 'just now';
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}

function renderPrices(data) {
  const grid = document.getElementById('prices-grid');
  grid.innerHTML = '';
  Object.entries(TOKEN_META).forEach(([id, meta]) => {
    const token = data[id];
    if (!token) return;
    const change = token.usd_24h_change;
    const isUp = change >= 0;
    const isPros = id === 'pharos-network';
    grid.innerHTML += `
      <div class="price-card ${isPros ? 'pros-card' : ''}">
        <div class="card-accent" style="background: ${meta.color};"></div>
        <div class="token-name">
          <div class="token-icon" style="background: ${meta.color}22; color: ${meta.color};">${meta.initials}</div>
          ${meta.symbol}${isPros ? ' <span style="font-size:10px;color:var(--pros);margin-left:2px;">Pharos</span>' : ''}
        </div>
        <div class="price-value">${formatPrice(token.usd)}</div>
        <div class="change ${isUp ? 'up' : 'down'}">
          <span class="change-arrow">${isUp ? '▲' : '▼'}</span>
          ${Math.abs(change).toFixed(2)}% (24h)
        </div>
      </div>`;
  });
}

function renderNews(articles) {
  const list = document.getElementById('news-list');
  list.innerHTML = '';
  articles.forEach((a, i) => {
    list.innerHTML += `
      <a class="news-item" href="${a.url}" target="_blank" rel="noopener">
        <div class="news-index">${String(i + 1).padStart(2, '0')}</div>
        <div class="news-content">
          <div class="news-title">${a.title}</div>
          <div class="news-meta">
            <span>${a.source.name}</span>
            <span class="dot">•</span>
            <span>${timeAgo(a.publishedAt)}</span>
          </div>
          ${a.description ? `<div class="news-summary">${a.description}</div>` : ''}
        </div>
        <div class="news-arrow">→</div>
      </a>`;
  });
}

function setStatus(type, message) {
  const bar = document.getElementById('status-bar');
  const text = document.getElementById('status-text');
  bar.className = `status-bar ${type}`;
  bar.style.display = 'flex';
  text.textContent = message;
}

async function loadData() {
  document.getElementById('last-updated').textContent = 'Refreshing...';

  const [priceResult, newsResult] = await Promise.allSettled([fetchPrices(), fetchNews()]);

  const priceOk = priceResult.status === 'fulfilled';
  const newsOk = newsResult.status === 'fulfilled';

  if (priceOk) renderPrices(priceResult.value);
  else document.getElementById('prices-grid').innerHTML = '<p style="color:var(--red);font-size:13px;">Price data unavailable</p>';

  if (newsOk) renderNews(newsResult.value.articles || []);
  else document.getElementById('news-list').innerHTML = '<p style="color:var(--red);font-size:13px;">News unavailable</p>';

  if (priceOk && newsOk) setStatus('ok', 'All data loaded successfully');
  else if (!priceOk && !newsOk) setStatus('error', 'Data unavailable — check your API keys');
  else setStatus('partial', 'Partial data — one source unavailable');

  document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
}

loadData();
</script>
</body>
</html>
